name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and release Peanut Bank APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Install Capacitor
        run: npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Generate Android project
        run: npx cap add android

      - name: Copy web build into Android app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Peanut-Bank.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Peanut Bank Android v1.0.${{ github.run_number }}
          body: |
            APK do Peanut Bank compilado automaticamente pelo GitHub Actions.

            Este é um APK de depuração (debug), não assinado para distribuição na Play Store.
          files: Peanut-Bank.apk
          generate_release_notes: true
